name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pygame

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --name HitchhikersTTT \
            --add-data "*.png:." \
            --add-data "Harlow Solid Regular.ttf:." \
            game_play.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name HitchhikersTTT \
            --add-data "*.png:." \
            --add-data "Harlow Solid Regular.ttf:." \
            game_play.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name HitchhikersTTT `
            --add-data "*.png;." `
            --add-data "Harlow Solid Regular.ttf;." `
            game_play.py

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/HitchhikersTTT.app dist/HitchhikersTTT-macOS.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: HitchhikersTTT-Linux
          path: dist/HitchhikersTTT

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HitchhikersTTT-Windows
          path: dist/HitchhikersTTT.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: HitchhikersTTT-macOS
          path: dist/HitchhikersTTT-macOS.zip

      - name: Attach to release (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HitchhikersTTT

      - name: Attach to release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HitchhikersTTT.exe

      - name: Attach to release (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HitchhikersTTT-macOS.zip
